name: Release

on:
  push:
    tags:
      - 'v*'

# Mirrors the gates in ci.yml so a tag never advertises a build that would fail
# mainline CI. PyPI publishing happens here via Trusted Publishing (OIDC) - no
# long-lived token anywhere (see AGENTS.md "Cutting a release"). Artifacts carry
# build-provenance attestations verifiable with `gh attestation verify`.
#
# Actions are SHA-pinned (version in the trailing comment); Dependabot
# (.github/dependabot.yml) opens PRs to bump them. Permissions are scoped per
# job - the top-level default is read-only.

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e '.[test]'
      - name: Syntax check
        run: python -m compileall -q owa_piggy
      - name: Tests
        run: >
          pytest -q --cov=owa_piggy --cov-branch
          --cov-report=term-missing --cov-fail-under=67
      - name: Core modules 100% branch
        run: >
          coverage report --fail-under=100
          --include=owa_piggy/oauth.py,owa_piggy/config.py,owa_piggy/cache.py,owa_piggy/token_flow.py,owa_piggy/jwt.py
      - name: Shellcheck
        run: shellcheck scripts/*.sh

  build:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # OIDC, for the provenance attestation
      attestations: write   # write the attestation to the GitHub attestations API
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Resolve version from tag
        id: version
        run: |
          ref="${GITHUB_REF##*/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Build sdist + wheel
        run: uv build
      - name: Attest build provenance (sdist + wheel)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Upload built distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  binaries:
    # Standalone PyInstaller binary - no Python install required.
    # See packaging/owa-piggy.spec and packaging/entry.py.
    needs: gates
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          # No macos-13/Intel leg: GitHub retired those hosted runners, so the
          # job sat `queued` with no runner forever and `github-release` (which
          # needs every binaries leg) never ran. That silently blocked every
          # GitHub Release from 0.16.0 through 1.1.1. macOS 26 is arm64-only
          # and Homebrew builds from source, so an Intel binary served nobody.
          - { os: macos-14,      target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Resolve version from tag
        id: version
        run: |
          ref="${GITHUB_REF##*/}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"
      - name: Install package + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install --no-deps .
      - name: Build binary
        working-directory: packaging
        run: pyinstaller --clean --noconfirm owa-piggy.spec
      - name: Archive binary
        working-directory: packaging/dist
        run: |
          archive="owa-piggy-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" owa-piggy
          echo "built $archive"
      - name: Attest build provenance (binary archive)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'packaging/dist/*.tar.gz'
      - name: Upload binary archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: packaging/dist/*.tar.gz
          if-no-files-found: error

  pypi-publish:
    # Trusted Publishing (OIDC): no stored credential. One-time PyPI setup -
    # add this repo + the `pypi` environment as a Trusted Publisher under the
    # project's Publishing settings (see AGENTS.md).
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # OIDC, no stored token
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create the GitHub Release and upload artifacts
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: owa-piggy v${{ needs.build.outputs.version }}
          generate_release_notes: true
          # artifacts/dist/* = wheel + sdist; artifacts/binary-*/* = standalone binaries
          files: |
            artifacts/dist/*
            artifacts/binary-*/*
          fail_on_unmatched_files: true
